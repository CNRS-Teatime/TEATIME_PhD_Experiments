  graph-config-schema.json: |
    {
      "$schema": "http://json-schema.org/draft-04/schema#",
      "description": "",
      "type": "object",
      "properties": {
        "graphs": {
          "type": "array",
          "uniqueItems": true,
          "minItems": 1,
          "items": {
            "required": [
              "name",
              "relations"
            ],
            "properties": {
              "name": {
                "type": "string",
                "minLength": 1
              },
              "relations": {
                "       type": "array",
                "uniqueItems": true,
                "minItems": 1,
                "items": {
                  "required": [
                    "edge_collection",
                    "from_vertex_collections",
                    "to_vertex_collections"
                  ],
                  "properties": {
                    "edge_collection": {
                      "type": "string",
                      "minLength": 1
                    },
                    "from_vertex_collections": {
                      "type": "array"
                    },
                    "to_vertex_collections": {
                      "type": "array"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "required": [
        "graphs"
      ]
    }
  theso-config-schema.json: |
    {
        "$schema": "http://json-schema.org/draft-04/schema#",
        "description": "Configuration of the openTheso to arangoDB Python tool",
        "type": "object",
        "properties": {
            "thesauri": {
                "type": "array",
                "description": "List of thesaurus specific config",
                "minItems": 1,
                "uniqueItems": true,
                "items": {
                    "type": "object",
                    "required": [
                        "name",
                        "source",
                        "type"
                    ],
                    "properties": {
                        "name": {
                            "type": "string",
                            "description": "The name of the collection in wich to put the thesaurus (The edges collection will just have '_EDGES' appended to this string)"
                        },
                        "source": {
                            "type": "string",
                            "description": "The API link to the thesaurus"
                        },
                        "type": {
                            "enum": ["raw", "graph"]
                        }
                    }
                }
            }
        },
        "required": [
            "thesauri"
        ]
    }